# Voyager -- base stack: data layer, application services, Datadog Agent.
#
# Overlays:
#   docker-compose.dev.yml      hot reload + data-layer ports published to the host
#   docker-compose.loadgen.yml  k6 and Playwright traffic generators
#
# Only the edge proxy is ever allowed to bind a host port in this file. Every
# other port stays on the private `voyager` network (02-TECH-STACK.md § 9).

name: voyager

networks:
  voyager:
    name: voyager
    driver: bridge

volumes:
  pgdata:
    name: voyager_pgdata
  redisdata:
    name: voyager_redisdata
  kafkadata:
    name: voyager_kafkadata

# Connection details shared by every service that talks to the data layer.
x-data-env: &data-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-voyager}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- see .env.example}
  POSTGRES_DB: ${POSTGRES_DB:-voyager}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}

# The two Source Code Integration values, passed into every image build.
# They are build args rather than runtime env because the tracer reads them at
# process start and the container has no git to ask. `make up` exports
# DD_GIT_COMMIT_SHA from the working tree; unset, SCI is simply off.
x-sci-args: &sci-args
  DD_GIT_REPOSITORY_URL: ${DD_GIT_REPOSITORY_URL:-}
  DD_GIT_COMMIT_SHA: ${DD_GIT_COMMIT_SHA:-}

# Merged into every first-party service. `DD_SERVICE` is deliberately absent:
# each service sets its own, and a default here would quietly give a service
# that forgot one the wrong name rather than an obvious blank.
#
# DD_AGENT_HOST is the container name because the Agent shares the bridge
# network. Point a tracer at localhost and it reports nothing at all, with no
# error -- which is the single most common way this setup silently fails.
x-datadog-env: &datadog-env
  DD_AGENT_HOST: datadog-agent
  DD_TRACE_AGENT_PORT: "8126"
  DD_DOGSTATSD_HOST: datadog-agent
  DD_DOGSTATSD_PORT: "8125"
  DD_ENV: ${DD_ENV:-demo}
  DD_VERSION: ${DD_VERSION:-dev}
  # Both styles, on every service. `datadog` keeps the Agent's own correlation
  # working; `tracecontext` is the W3C header the browser's RUM SDK sends, and
  # without it the RUM-to-APM link breaks at the gateway.
  DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext
  DD_TRACE_ENABLED: "true"
  DD_TRACE_SAMPLE_RATE: ${DD_TRACE_SAMPLE_RATE:-1.0}
  DD_TRACE_SAMPLING_RULES: ${DD_TRACE_SAMPLING_RULES:-}
  DD_LOGS_INJECTION: ${DD_LOGS_INJECTION:-true}
  DD_PROFILING_ENABLED: ${DD_PROFILING_ENABLED:-true}
  DD_DATA_STREAMS_ENABLED: ${DD_DATA_STREAMS_ENABLED:-true}
  DD_RUNTIME_METRICS_ENABLED: "true"
  # Source Code Integration: these two turn a stack frame in Error Tracking
  # into a link to the exact line on the default branch.
  DD_GIT_REPOSITORY_URL: ${DD_GIT_REPOSITORY_URL:-}
  DD_GIT_COMMIT_SHA: ${DD_GIT_COMMIT_SHA:-}
  DD_TAGS: project:voyager,team:demo,owner:${OWNER:-voyager}

x-data-layer-ready: &data-layer-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:16.4
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    networks: [voyager]
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voyager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-voyager}
      # Read by the init scripts via psql's \getenv. They run on first boot
      # only; `make dbm-setup` re-applies 03-datadog.sql to a volume that
      # already exists, and reads these from the container environment too.
      MOCK_DB_PASSWORD: ${MOCK_DB_PASSWORD:?MOCK_DB_PASSWORD is required -- see .env.example}
      DD_PG_PASSWORD: ${DD_PG_PASSWORD:?DD_PG_PASSWORD is required -- see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # Autodiscovery via labels rather than a static Agent config file, so a
    # service and the check that watches it live in one place (§ 6.1).
    labels:
      com.datadoghq.ad.checks: |
        {"postgres":{"init_config":{},"instances":[{
          "host":"%%host%%","port":5432,
          "username":"datadog","password":"${DD_PG_PASSWORD:-}","dbname":"${POSTGRES_DB:-voyager}",
          "dbm":true,
          "reported_hostname":"voyager-postgres",
          "collect_schemas":{"enabled":true},
          "query_samples":{"enabled":true},
          "query_metrics":{"enabled":true},
          "query_activity":{"enabled":true},
          "collect_settings":{"enabled":true},
          "relations":[{"relation_regex":".*"}],
          "tags":["project:voyager","service:voyager-postgres"]
        }]}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 3g
    shm_size: 512m

  redis:
    image: redis:7.4
    container_name: redis
    hostname: redis
    restart: unless-stopped
    networks: [voyager]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redisdata:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    labels:
      com.datadoghq.ad.checks: |
        {"redisdb":{"init_config":{},"instances":[{"host":"%%host%%","port":"6379"}]}}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 512m

  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    networks: [voyager]
    environment:
      # Single-broker KRaft: no ZooKeeper container, which saves ~400 MB.
      # CLUSTER_ID must be a 22-character base64 UUID; it is pinned so that a
      # re-created volume formats to the same cluster.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by the init job in Phase 4 so that
      # partition counts and consumer groups match 05-FUNCTIONALITY.md § 6.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx1g -Xms1g
      # JMX on 9999 is what the Agent's `kafka` check scrapes for broker
      # metrics; Data Streams Monitoring covers lag from the client side.
      KAFKA_JMX_OPTS: >-
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.port=9999
        -Dcom.sun.management.jmxremote.rmi.port=9999
        -Djava.rmi.server.hostname=kafka
    volumes:
      - kafkadata:/var/lib/kafka
    labels:
      # Two checks, because they answer different questions: `kafka` scrapes
      # broker health over JMX, `kafka_consumer` reports per-group lag. Data
      # Streams Monitoring also reports lag, from the client side -- run all
      # three, since a broker that is fine while a consumer is stalled looks
      # identical to a healthy system from any one of them alone.
      com.datadoghq.ad.checks: |
        {
          "kafka":{"init_config":{},"instances":[{"host":"%%host%%","port":9999}]},
          "kafka_consumer":{"init_config":{},"instances":[{
            "kafka_connect_str":"%%host%%:9092",
            "monitor_unlisted_consumer_groups":true
          }]}
        }
    healthcheck:
      # KAFKA_JMX_OPTS is inherited by every CLI tool launched in this
      # container, and each one then tries to bind 9999 -- which the broker
      # already holds. Clear it for anything run alongside the broker.
      test: ["CMD-SHELL", "KAFKA_JMX_OPTS= /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    mem_limit: 2g

  # ------------------------------------------------- mock third parties --
  # These stand in for the outside world. They are the only place in the
  # stack where latency, failure and rate limits are simulated rather than
  # real, which is what makes a demo repeatable.

  mock-gds:
    build:
      context: ./mocks/mock-gds
      args:
        <<: *sci-args
    container_name: mock-gds
    hostname: mock-gds
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *datadog-env
      DD_SERVICE: mock-gds
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voyager}
      # A third party does not get write access to the booking database.
      MOCK_DB_USER: voyager_readonly
      MOCK_DB_PASSWORD: ${MOCK_DB_PASSWORD:?MOCK_DB_PASSWORD is required -- see .env.example}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4900/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 384m

  mock-payments:
    build:
      context: ./mocks/mock-payments
      args:
        <<: *sci-args
    container_name: mock-payments
    hostname: mock-payments
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *datadog-env
      DD_SERVICE: mock-payments
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PAYMENT_WEBHOOK_URL: http://payment-service:4040/v1/webhooks/provider
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4910/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 256m

  mock-email:
    build:
      context: ./mocks/mock-email
      args:
        <<: *sci-args
    container_name: mock-email
    hostname: mock-email
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *datadog-env
      DD_SERVICE: mock-email
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4920/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 256m

  mock-llm:
    build:
      context: ./mocks/mock-llm
      args:
        <<: *sci-args
    container_name: mock-llm
    hostname: mock-llm
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *datadog-env
      DD_SERVICE: mock-llm
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LLM_MODEL: ${LLM_MODEL:-voyager-support-v1}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4930/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 384m

  # ------------------------------------------------------------- services --

  pricing-service:
    build:
      context: ./services/pricing-service
      args:
        <<: *sci-args
    container_name: pricing-service
    hostname: pricing-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*data-env, *datadog-env]
      DD_SERVICE: voyager-pricing
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4020/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m

  search-service:
    build:
      context: ./services/search-service
      args:
        <<: *sci-args
    container_name: search-service
    hostname: search-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      redis:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      mock-gds:
        condition: service_healthy
    environment:
      <<: *datadog-env
      DD_SERVICE: voyager-search
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GDS_BASE_URL: http://mock-gds:4900
      PRICING_BASE_URL: http://pricing-service:4020
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4010/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 512m

  # kafka-init creates every topic in 05-FUNCTIONALITY.md § 6 and exits. It
  # reuses the broker image purely for the CLI tools, so there is nothing to
  # build and nothing extra to pull.
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: kafka-init
    networks: [voyager]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka:/scripts:ro
    restart: "no"
    mem_limit: 512m

  booking-service:
    build:
      context: ./services/booking-service
      args:
        <<: *sci-args
    container_name: booking-service
    hostname: booking-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      search-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    environment:
      <<: [*data-env, *datadog-env]
      DD_SERVICE: voyager-booking
      # ddtrace names integration spans after the library, so every Python
      # service reports its database as plain `postgres` and its cache as
      # plain `redis`. On the Service Map that collapses four services onto
      # two shared nodes and makes "which service is hammering the database"
      # unanswerable. The Node tracers do the same thing via tracer.use();
      # Python has no equivalent, so it is done with this mapping.
      DD_SERVICE_MAPPING: postgres:voyager-booking-postgres,redis:voyager-booking-redis,kafka:voyager-booking-kafka
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      SEARCH_BASE_URL: http://search-service:4010
      PRICING_BASE_URL: http://pricing-service:4020
      HOLD_TTL_MINUTES: ${HOLD_TTL_MINUTES:-15}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4030/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m

  payment-service:
    build:
      context: ./services/payment-service
      args:
        <<: *sci-args
    container_name: payment-service
    hostname: payment-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mock-payments:
        condition: service_healthy
    environment:
      <<: [*data-env, *datadog-env]
      DD_SERVICE: voyager-payment
      # ddtrace names integration spans after the library, so every Python
      # service reports its database as plain `postgres` and its cache as
      # plain `redis`. On the Service Map that collapses four services onto
      # two shared nodes and makes "which service is hammering the database"
      # unanswerable. The Node tracers do the same thing via tracer.use();
      # Python has no equivalent, so it is done with this mapping.
      DD_SERVICE_MAPPING: postgres:voyager-payment-postgres,redis:voyager-payment-redis,kafka:voyager-payment-kafka
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      PAYMENTS_BASE_URL: http://mock-payments:4910
      BOOKING_BASE_URL: http://booking-service:4030
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4040/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m

  loyalty-service:
    build:
      context: ./services/loyalty-service
      args:
        <<: *sci-args
    container_name: loyalty-service
    hostname: loyalty-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: [*data-env, *datadog-env]
      DD_SERVICE: voyager-loyalty
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first
      # and Fastify is listening on IPv4 only, so the probe is refused while
      # the service is perfectly healthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4050/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 512m

  # No Postgres: notification-worker owns no table and reads none. Its state is
  # the consumer group offset.
  notification-worker:
    build:
      context: ./services/notification-worker
      args:
        <<: *sci-args
    container_name: notification-worker
    hostname: notification-worker
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mock-email:
        condition: service_healthy
    environment:
      <<: *datadog-env
      DD_SERVICE: voyager-notifications
      # ddtrace names integration spans after the library, so every Python
      # service reports its database as plain `postgres` and its cache as
      # plain `redis`. On the Service Map that collapses four services onto
      # two shared nodes and makes "which service is hammering the database"
      # unanswerable. The Node tracers do the same thing via tracer.use();
      # Python has no equivalent, so it is done with this mapping.
      DD_SERVICE_MAPPING: redis:voyager-notifications-redis,kafka:voyager-notifications-kafka
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      EMAIL_BASE_URL: http://mock-email:4920
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@voyager.demo}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4060/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m

  ai-support-service:
    build:
      context: ./services/ai-support-service
      args:
        <<: *sci-args
    container_name: ai-support-service
    hostname: ai-support-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      loyalty-service:
        condition: service_healthy
    environment:
      # *data-env also carries KAFKA_BROKERS, which this service does not use.
      <<: [*data-env, *datadog-env]
      DD_SERVICE: voyager-ai-support
      # ddtrace names integration spans after the library, so every Python
      # service reports its database as plain `postgres` and its cache as
      # plain `redis`. On the Service Map that collapses four services onto
      # two shared nodes and makes "which service is hammering the database"
      # unanswerable. The Node tracers do the same thing via tracer.use();
      # Python has no equivalent, so it is done with this mapping.
      DD_SERVICE_MAPPING: postgres:voyager-ai-support-postgres,redis:voyager-ai-support-redis
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      # LLM Observability. The service calls LLMObs.enable() itself, in
      # app/llmobs.py. DD_LLMOBS_ENABLED is deliberately left empty rather than
      # set to true: a truthy value makes ddtrace's own bootstrap enable the
      # product first, with integrations on, which re-patches openai regardless
      # of DD_TRACE_OPENAI_ENABLED below. Set it to false to switch LLM
      # Observability off; anything truthy here doubles every completion.
      DD_LLMOBS_ENABLED: ${DD_LLMOBS_ENABLED:-}
      DD_LLMOBS_ML_APP: ${DD_LLMOBS_ML_APP:-voyager-support}
      # ddtrace's openai integration emits an `llm` span of its own once LLM
      # Observability is on, so every completion would be counted twice and
      # every token and cost figure would read double. The service opens its
      # own `chat.completion` span instead, and the hop to mock-llm is still
      # traced by the httpx integration underneath the client.
      DD_TRACE_OPENAI_ENABLED: "false"
      LLM_COST_INPUT_USD_PER_MILLION: ${LLM_COST_INPUT_USD_PER_MILLION:-0.50}
      LLM_COST_OUTPUT_USD_PER_MILLION: ${LLM_COST_OUTPUT_USD_PER_MILLION:-1.50}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://mock-llm:4930/v1}
      LLM_API_KEY: ${LLM_API_KEY:-mock-key}
      LLM_MODEL: ${LLM_MODEL:-voyager-support-v1}
      BOOKING_BASE_URL: http://booking-service:4030
      LOYALTY_BASE_URL: http://loyalty-service:4050
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4070/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m

  api-gateway:
    build:
      context: ./services/api-gateway
      args:
        <<: *sci-args
    container_name: api-gateway
    hostname: api-gateway
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*data-env, *datadog-env]
      DD_SERVICE: voyager-gateway
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      SEARCH_BASE_URL: http://search-service:4010
      PRICING_BASE_URL: http://pricing-service:4020
      BOOKING_BASE_URL: http://booking-service:4030
      PAYMENT_BASE_URL: http://payment-service:4040
      LOYALTY_BASE_URL: http://loyalty-service:4050
      NOTIFICATIONS_BASE_URL: http://notification-worker:4060
      AI_SUPPORT_BASE_URL: http://ai-support-service:4070
      SCENARIOS_DIR: /app/scenarios
    volumes:
      # The catalogue is data, so it is mounted rather than baked in: editing
      # a flag's metadata during a demo is a restart, not a rebuild.
      - ./tools/scenarios:/app/scenarios:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 512m


  # ------------------------------------------------------------ frontend --

  web-ui:
    build:
      context: .
      dockerfile: apps/web-ui/Dockerfile
      args:
        <<: *sci-args
        DD_ENV: ${DD_ENV:-demo}
        DD_VERSION: ${DD_VERSION:-dev}
        # Baked in, not passed at runtime: Vite substitutes every VITE_* value
        # at build time, so a container started with a different one serves
        # the old value and looks like a caching bug.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
        VITE_DD_SITE: ${DD_SITE:-datadoghq.com}
        # VITE_DD_ENV, VITE_DD_VERSION and VITE_DD_GIT_COMMIT_SHA are derived
        # in the Dockerfile from DD_ENV, DD_VERSION and DD_GIT_COMMIT_SHA
        # above. Passing them here as well would give one value two sources
        # that can disagree.
    container_name: web-ui
    hostname: web-ui
    restart: unless-stopped
    networks: [voyager]
    # No depends_on: the static assets must be servable whether or not the
    # gateway is healthy, because "the API is down" is a screen the demo
    # needs to be able to show.
    environment:
      # There is no tracer in this image. These exist so the Agent's container
      # tagging files the browser's own logs and RUM under the same service.
      DD_SERVICE: voyager-web
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 and
      # nginx here listens on IPv4 only, so the name form reports unhealthy
      # while the server is serving perfectly well.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 128m

  # -------------------------------------------------------------- datadog --

  datadog-agent:
    image: gcr.io/datadoghq/agent:7.57.2
    container_name: datadog-agent
    hostname: voyager-demo-1
    restart: unless-stopped
    networks: [voyager]
    # No depends_on. The Agent must come up whether or not the application
    # does -- an Agent that waits for Postgres cannot report that Postgres is
    # down, which is exactly when you want it.
    environment:
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY is required -- see .env.example}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-demo}
      DD_HOSTNAME: voyager-demo-1
      DD_TAGS: project:voyager team:demo owner:${OWNER:-voyager}

      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_APM_RECEIVER_PORT: "8126"

      DD_USE_DOGSTATSD: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_PORT: "8125"

      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: name:datadog-agent

      DD_PROCESS_AGENT_ENABLED: "true"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"

      DD_DATABASE_MONITORING_ENABLED: "true"

      # § 6 says to leave this off unless the AMI cooperates. NPM needs eBPF
      # and a matching kernel; on Colima it fails noisily and buys nothing.
      DD_SYSTEM_PROBE_NETWORK_ENABLED: "false"
    volumes:
      - ./infra/datadog/datadog.yaml:/etc/datadog-agent/datadog.yaml:ro
      # Autodiscovery reads container labels through the socket. Read-only,
      # because the Agent has no business starting or stopping anything.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      # Where the JSON file log driver writes. Without this mount, log
      # collection silently returns nothing.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    healthcheck:
      test: ["CMD-SHELL", "agent health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 45s
    mem_limit: 768m

  # ----------------------------------------------------------------- jobs --
  # Profiled out of `make up`; run explicitly by `make seed`.

  seeder:
    build:
      context: ./tools/seeder
      args:
        <<: *sci-args
    container_name: seeder
    profiles: ["tools"]
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*data-env, *datadog-env]
      DD_SERVICE: voyager-seeder
      DD_ENV: ${DD_ENV:-demo}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-20260101}
      SEED_ANCHOR_DATE: ${SEED_ANCHOR_DATE:-}
    mem_limit: 1g
