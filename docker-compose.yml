# Voyager -- base stack: data layer, application services, Datadog Agent.
#
# Overlays:
#   docker-compose.dev.yml      hot reload + data-layer ports published to the host
#   docker-compose.loadgen.yml  k6 and Playwright traffic generators
#
# Only the edge proxy is ever allowed to bind a host port in this file. Every
# other port stays on the private `voyager` network (02-TECH-STACK.md § 9).

name: voyager

networks:
  voyager:
    name: voyager
    driver: bridge

volumes:
  pgdata:
    name: voyager_pgdata
  redisdata:
    name: voyager_redisdata
  kafkadata:
    name: voyager_kafkadata

# Connection details shared by every service that talks to the data layer.
x-data-env: &data-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-voyager}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- see .env.example}
  POSTGRES_DB: ${POSTGRES_DB:-voyager}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}

x-data-layer-ready: &data-layer-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:16.4
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    networks: [voyager]
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voyager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-voyager}
      # Read by init/02-readonly-role.sql via psql's \getenv, on first boot only.
      MOCK_DB_PASSWORD: ${MOCK_DB_PASSWORD:?MOCK_DB_PASSWORD is required -- see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 3g
    shm_size: 512m

  redis:
    image: redis:7.4
    container_name: redis
    hostname: redis
    restart: unless-stopped
    networks: [voyager]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redisdata:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 512m

  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    networks: [voyager]
    environment:
      # Single-broker KRaft: no ZooKeeper container, which saves ~400 MB.
      # CLUSTER_ID must be a 22-character base64 UUID; it is pinned so that a
      # re-created volume formats to the same cluster.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by the init job in Phase 4 so that
      # partition counts and consumer groups match 05-FUNCTIONALITY.md § 6.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx1g -Xms1g
      # JMX on 9999 is what the Agent's `kafka` check scrapes for broker
      # metrics; Data Streams Monitoring covers lag from the client side.
      KAFKA_JMX_OPTS: >-
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.port=9999
        -Dcom.sun.management.jmxremote.rmi.port=9999
        -Djava.rmi.server.hostname=kafka
    volumes:
      - kafkadata:/var/lib/kafka
    healthcheck:
      # KAFKA_JMX_OPTS is inherited by every CLI tool launched in this
      # container, and each one then tries to bind 9999 -- which the broker
      # already holds. Clear it for anything run alongside the broker.
      test: ["CMD-SHELL", "KAFKA_JMX_OPTS= /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    mem_limit: 2g

  # ------------------------------------------------- mock third parties --
  # These stand in for the outside world. They are the only place in the
  # stack where latency, failure and rate limits are simulated rather than
  # real, which is what makes a demo repeatable.

  mock-gds:
    build:
      context: ./mocks/mock-gds
    container_name: mock-gds
    hostname: mock-gds
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DD_SERVICE: mock-gds
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voyager}
      # A third party does not get write access to the booking database.
      MOCK_DB_USER: voyager_readonly
      MOCK_DB_PASSWORD: ${MOCK_DB_PASSWORD:?MOCK_DB_PASSWORD is required -- see .env.example}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4900/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 384m

  mock-payments:
    build:
      context: ./mocks/mock-payments
    container_name: mock-payments
    hostname: mock-payments
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DD_SERVICE: mock-payments
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PAYMENT_WEBHOOK_URL: http://payment-service:4040/v1/webhooks/provider
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4910/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 256m

  mock-email:
    build:
      context: ./mocks/mock-email
    container_name: mock-email
    hostname: mock-email
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DD_SERVICE: mock-email
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4920/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 256m

  mock-llm:
    build:
      context: ./mocks/mock-llm
    container_name: mock-llm
    hostname: mock-llm
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DD_SERVICE: mock-llm
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LLM_MODEL: ${LLM_MODEL:-voyager-support-v1}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4930/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 384m

  # ------------------------------------------------------------- services --

  pricing-service:
    build:
      context: ./services/pricing-service
    container_name: pricing-service
    hostname: pricing-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *data-env
      DD_SERVICE: voyager-pricing
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4020/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m

  search-service:
    build:
      context: ./services/search-service
    container_name: search-service
    hostname: search-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      redis:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      mock-gds:
        condition: service_healthy
    environment:
      DD_SERVICE: voyager-search
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GDS_BASE_URL: http://mock-gds:4900
      PRICING_BASE_URL: http://pricing-service:4020
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4010/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 512m

  # kafka-init creates every topic in 05-FUNCTIONALITY.md § 6 and exits. It
  # reuses the broker image purely for the CLI tools, so there is nothing to
  # build and nothing extra to pull.
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: kafka-init
    networks: [voyager]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka:/scripts:ro
    restart: "no"
    mem_limit: 512m

  booking-service:
    build:
      context: ./services/booking-service
    container_name: booking-service
    hostname: booking-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      search-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    environment:
      <<: *data-env
      DD_SERVICE: voyager-booking
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      SEARCH_BASE_URL: http://search-service:4010
      PRICING_BASE_URL: http://pricing-service:4020
      HOLD_TTL_MINUTES: ${HOLD_TTL_MINUTES:-15}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4030/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m

  payment-service:
    build:
      context: ./services/payment-service
    container_name: payment-service
    hostname: payment-service
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mock-payments:
        condition: service_healthy
    environment:
      <<: *data-env
      DD_SERVICE: voyager-payment
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      PAYMENTS_BASE_URL: http://mock-payments:4910
      BOOKING_BASE_URL: http://booking-service:4030
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4040/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: api-gateway
    hostname: api-gateway
    restart: unless-stopped
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *data-env
      DD_SERVICE: voyager-gateway
      DD_ENV: ${DD_ENV:-demo}
      DD_VERSION: ${DD_VERSION:-dev}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      SEARCH_BASE_URL: http://search-service:4010
      PRICING_BASE_URL: http://pricing-service:4020
      BOOKING_BASE_URL: http://booking-service:4030
      PAYMENT_BASE_URL: http://payment-service:4040
      LOYALTY_BASE_URL: http://loyalty-service:4050
      NOTIFICATIONS_BASE_URL: http://notification-worker:4060
      AI_SUPPORT_BASE_URL: http://ai-support-service:4070
      SCENARIOS_DIR: /app/scenarios
    volumes:
      # The catalogue is data, so it is mounted rather than baked in: editing
      # a flag's metadata during a demo is a restart, not a rebuild.
      - ./tools/scenarios:/app/scenarios:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 512m

  # ----------------------------------------------------------------- jobs --
  # Profiled out of `make up`; run explicitly by `make seed`.

  seeder:
    build:
      context: ./tools/seeder
    container_name: seeder
    profiles: ["tools"]
    networks: [voyager]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *data-env
      DD_SERVICE: voyager-seeder
      DD_ENV: ${DD_ENV:-demo}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-20260101}
      SEED_ANCHOR_DATE: ${SEED_ANCHOR_DATE:-}
    mem_limit: 1g
