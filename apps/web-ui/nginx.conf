# Static hosting for the SPA. The edge proxy terminates TLS and routes /api to
# the gateway, so this server only ever sees asset requests.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    # Long-lived caching is safe only for the hashed bundle output.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Generated artwork: content-addressed by seed, so a month is safe, but the
    # filenames are not hashed and must stay revalidatable.
    location /hotels/ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /airlines/ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The fixture service worker must never reach a deployed environment.
    location = /mockServiceWorker.js {
        return 404;
    }

    # The entry document carries the bundle hashes, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routing: every unknown path is a React route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
