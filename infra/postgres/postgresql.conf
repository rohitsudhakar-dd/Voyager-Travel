# Voyager PostgreSQL 16 configuration.
# Mounted read-only and selected with `-c config_file=`, so this file must also
# point at the data directory's auth files -- they are generated inside PGDATA
# by the image's entrypoint, not next to this file.

data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

listen_addresses = '*'
port = 5432
max_connections = 200

# ---- Memory (container limit is 3 GB; see 02-TECH-STACK.md § 9.1) ----
shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 256MB

# ---- WAL / checkpoints ----
wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# ---- Planner ----
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ---- Database Monitoring (02-TECH-STACK.md § 6.2) ----
# shared_preload_libraries requires a restart, not a reload, so it is set from
# the very first boot -- adding it later means re-initialising the volume.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_activity_query_size = 4096
track_io_timing = on

# ---- Logging ----
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
