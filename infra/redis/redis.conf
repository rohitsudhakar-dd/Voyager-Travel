# Voyager Redis 7.4 configuration.
# Redis is both the search-result cache and the store for the `voyager:chaos`
# hash, which is why the eviction policy below is not negotiable.

bind 0.0.0.0
port 6379
protected-mode no

# ---- Memory (container limit is 512 MB; see 02-TECH-STACK.md § 9.1) ----
maxmemory 400mb

# volatile-lru evicts only keys that carry a TTL. Search results have a 120s
# TTL and are evictable; `voyager:chaos` has no TTL and therefore can never be
# evicted. Under allkeys-lru, memory pressure could silently drop chaos state
# in the middle of a demo.
maxmemory-policy volatile-lru

# ---- Persistence ----
# Snapshots only. Refresh tokens and chaos flags survive a restart; the search
# cache is expected to be cold after one and that is a fine demo state.
save 300 10
appendonly no
dir /data

# ---- Diagnostics ----
# Redis integration metrics and the cache-hit-ratio widget on dashboard D4 read
# from INFO, which these keep meaningful.
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
