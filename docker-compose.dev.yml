# Local-development overlay: publishes the data layer to the host so psql,
# redis-cli and kafka tooling work from a terminal.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Never apply this overlay on the EC2 host. The security group assumes only
# Caddy is reachable (02-TECH-STACK.md § 9).

name: voyager

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  kafka:
    # Clients on the host resolve `localhost:19092`; clients inside the
    # network keep using `kafka:9092`. Both listeners must be advertised or
    # one side gets an address it cannot reach.
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    ports:
      - "127.0.0.1:19092:19092"

  # Reaching the SPA without going through Caddy, which on `localhost` redirects
  # to HTTPS and presents a certificate from its own CA. This origin is also the
  # only one that is genuinely cross-origin to the gateway, so it is what the
  # browser RUM tracing headers and the gateway CORS config are exercised against.
  web-ui:
    ports:
      - "127.0.0.1:8080:8080"

  api-gateway:
    ports:
      - "127.0.0.1:4000:4000"

  search-service:
    ports:
      - "127.0.0.1:4010:4010"

  pricing-service:
    ports:
      - "127.0.0.1:4020:4020"

  booking-service:
    ports:
      - "127.0.0.1:4030:4030"

  payment-service:
    ports:
      - "127.0.0.1:4040:4040"

  loyalty-service:
    ports:
      - "127.0.0.1:4050:4050"

  # Health only; notification-worker's real interface is the consumer group.
  notification-worker:
    ports:
      - "127.0.0.1:4060:4060"

  ai-support-service:
    ports:
      - "127.0.0.1:4070:4070"

  # The mocks are published so you can curl a provider directly while
  # debugging, without going through search-service.
  mock-gds:
    ports:
      - "127.0.0.1:4900:4900"

  mock-payments:
    ports:
      - "127.0.0.1:4910:4910"

  mock-email:
    ports:
      - "127.0.0.1:4920:4920"

  mock-llm:
    ports:
      - "127.0.0.1:4930:4930"
